[package]
name = "transsafety-minimal-core"
version = "0.2.0"
authors = ["Malene Jung"]
description = "The core functionality of transsafety-minimal"
repository = "https://github.com/MaleneJung/transsafety-minimal-core"
edition = "2024"
license = "MIT OR Apache-2.0"

[lib]
crate-type = ["cdylib"]

[dependencies]
hex = "0.4.3"
js-sys = "0.3.107"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
wasm-bindgen = "0.2.130"
